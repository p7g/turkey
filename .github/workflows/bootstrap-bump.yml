# Labels a pull request that changes bootstrap/, so that it is merged with a
# merge commit.
#
# bootstrap/PROVENANCE names the commit the committed compiler was built from,
# and that commit is on the pull request's branch. A squash or rebase merge
# replaces it with a new commit, and the one PROVENANCE names is no longer in
# main's history. GitHub cannot restrict the merge method for some pull requests
# and not others, so the label is a warning to whoever merges; the provenance
# test in tests/test_bootstrap.py is what fails if the warning is missed.
name: bootstrap-bump

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    # A fork's pull request gets a read-only token and cannot be labelled.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      LABEL: "bootstrap bump: merge commit only"
    steps:
      - run: |
          if gh pr diff "$PR" --name-only | grep -q '^bootstrap/'; then
            gh label create "$LABEL" --force --color B60205 \
              --description "Squash or rebase orphans the commit bootstrap/PROVENANCE names"
            gh pr edit "$PR" --add-label "$LABEL"
          else
            gh pr edit "$PR" --remove-label "$LABEL" 2>/dev/null || true
          fi
