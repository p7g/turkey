# Publishes the standard library's API documentation to GitHub Pages.
#
# `scripts/docs.sh` builds `boot` from the committed bootstrap if it is not
# there, runs `boot doc` over the library and writes one self-contained
# `index.html`, which is the whole site. No test runs here: the suite has its
# own workflow, and this one runs only on `main` so that a pull request costs
# nothing.
#
# Needs Settings > Pages > Source set to "GitHub Actions" once.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TURKEY_CC: gcc

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy still waiting or running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/docs.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
