# Publishes the standard library's API documentation to GitHub Pages.
#
# `scripts/docs.sh` builds `boot` from the committed bootstrap if it is not
# there, runs `boot doc` over the library and writes `index.html`, one
# self-contained page, and `docs.json`, the data it is built from. Both are
# published. No test runs here: the suite has its own workflow, and this one
# runs only on `main`, and only when a path the output depends on changes, so
# that neither a pull request nor an unrelated push costs a build.
#
# Needs Settings > Pages > Source set to "GitHub Actions" once.
name: docs

on:
  push:
    branches: [main]
    # What `scripts/docs.sh` reads: the library, the compiler it builds
    # (`src/`, from `bootstrap/` by `scripts/build.sh`) and the page template.
    paths:
      - lib/**
      - src/**
      - bootstrap/**
      - scripts/docs.sh
      - scripts/docs.html
      - scripts/build.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

env:
  TURKEY_CC: gcc

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that is running finishes, since cancelling `deploy-pages` partway
# can leave a half-published site. A newer push waits behind it, and replaces
# any run already waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/docs.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
