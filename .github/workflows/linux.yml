# The compiler built and tested on arm64 Linux, natively.
#
# Under both C compilers, because they differ in what the suite can check:
# gcc cannot compile `boot llvm`'s output, so those tests skip under it, and
# clang is the compiler that lays out the runtime's frames differently from
# Darwin's. Built from the committed bootstrap, as a user would build it.
name: linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      TURKEY_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      # pytest from apt: Ubuntu 24.04 refuses a system-wide `pip install`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} python3-pytest python3-pytest-xdist
      - run: sh scripts/build.sh
      - run: python3 -m pytest tests -q
        env:
          TURKEY_BOOT: ${{ github.workspace }}/build/stages/stage2
      - run: python3 -m pytest tests -q -m bootstrap
        env:
          TURKEY_BOOT: ${{ github.workspace }}/build/stages/stage2
