# The compiler built and tested on arm64 Linux, natively.
#
# Under gcc, Ubuntu's `cc`, and not clang as well: `boot` writes its own
# objects, so the C compiler only links them, through the same ld and glibc
# either way, and compiles the few C files the tests use. A run on macOS
# links with clang. Built from the committed bootstrap, as a user would build
# it.
#
# `boot` is built once and the suite is split across jobs by
# `scripts/ci-shard.sh`: a free runner has four cores, and the whole suite on
# one takes over twenty minutes. Each shard runs with `-m ''`, so the
# fixed point runs in the shard that holds it, overlapping that shard's other
# tests. The cases the Turkey harness runs (`scripts/test.sh`) are split the
# same six ways by its own `--shard`, and each job also runs its selftest.
name: linux

on:
  push:
    branches: [main]
  pull_request:

env:
  TURKEY_CC: gcc

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: build/stages/stage2
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: bootstrap, number: 1 }
          - { shard: native, number: 2 }
          - { shard: assembler, number: 3 }
          - { shard: passes, number: 4 }
          - { shard: system, number: 5 }
          - { shard: language, number: 6 }
    env:
      TURKEY_BOOT: ${{ github.workspace }}/boot/stage2
    steps:
      - uses: actions/checkout@v4
        # Whole history: the tests check that the commit
        # bootstrap/PROVENANCE names exists.
        with:
          fetch-depth: 0
      # pytest from apt: Ubuntu 24.04 refuses a system-wide `pip install`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-pytest-xdist
      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot
      # An artifact does not keep the executable bit.
      - run: chmod +x boot/stage2
      - run: |
          args=$(sh scripts/ci-shard.sh ${{ matrix.shard }})
          python3 -m pytest -q -m '' $args
      - if: ${{ !cancelled() }}
        run: sh scripts/test.sh --selftest
      - if: ${{ !cancelled() }}
        run: sh scripts/test.sh --shard ${{ matrix.number }}/6
