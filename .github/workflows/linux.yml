# The compiler built and tested on arm64 Linux, natively.
#
# Under both C compilers, because they differ in what the suite can check:
# gcc cannot compile `boot llvm`'s output, so those tests skip under it, and
# clang is the one that runs them. Built from the committed bootstrap, as a
# user would build it.
#
# `boot` is built once per C compiler and the suite is split across jobs by
# `scripts/ci-shard.sh`: a free runner has four cores, and the whole suite on
# one takes over twenty minutes. Each shard runs with `-m ''`, so the
# fixed point runs in the shard that holds it, overlapping that shard's other
# tests.
name: linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      TURKEY_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }}
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.cc }}
          path: build/stages/stage2
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        shard: [self, backend, corpus, language]
    env:
      TURKEY_CC: ${{ matrix.cc }}
      TURKEY_BOOT: ${{ github.workspace }}/boot/stage2
    steps:
      - uses: actions/checkout@v4
        # Whole history: the tests check that the commit
        # bootstrap/PROVENANCE names exists.
        with:
          fetch-depth: 0
      # pytest from apt: Ubuntu 24.04 refuses a system-wide `pip install`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} python3-pytest python3-pytest-xdist
      - uses: actions/download-artifact@v4
        with:
          name: boot-${{ matrix.cc }}
          path: boot
      # An artifact does not keep the executable bit.
      - run: chmod +x boot/stage2
      - run: |
          args=$(sh scripts/ci-shard.sh ${{ matrix.shard }})
          python3 -m pytest -q -m '' $args
