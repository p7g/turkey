# The compiler built and tested on arm64 Linux, natively.
#
# Under gcc, Ubuntu's `cc`, and not clang as well: `boot` writes its own
# objects, so the C compiler only links them, through the same ld and glibc
# either way, and compiles the few C files the tests use. A run on macOS
# links with clang. Built from the committed bootstrap, as a user would build
# it.
#
# `boot` is built once and the suite is split across jobs by
# `scripts/ci-shard.sh`: a free runner has four cores, and the whole suite on
# one takes over twenty minutes. Each shard runs with `-m ''`, so the
# fixed point runs in the shard that holds it, overlapping that shard's other
# tests. The cases the Turkey harness runs (`scripts/test.sh`) are split the
# same seven ways by its own `--shard`, and each job also runs its selftest.
#
# The test jobs install OpenSSL 3's headers and libraries (`libssl-dev`) for
# the programs that import `Net.TLS`, which link with `-lssl -lcrypto`, and
# set `TURKEY_REQUIRE_OPENSSL` so that those tests fail rather than skip if it
# is missing. Nothing else links it. They also install gdb and LLVM's tools,
# which `tests/test_debug_info.py` reads `-g`'s DWARF with and skips without.
#
# Each shard also runs its cases through the executable writer
# (`scripts/test.sh --exe`), which links nothing, against the same goldens.
# The `floor` job runs what that writer makes on the oldest glibc it
# supports, 2.34, in an AlmaLinux 9 container: hello world, and `boot`
# written by itself, compiling itself to the same bytes there.
name: linux

on:
  push:
    branches: [main]
  pull_request:

env:
  TURKEY_CC: gcc

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: build/stages/stage2
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: bootstrap, number: 1 }
          - { shard: native, number: 2 }
          - { shard: generational, number: 3 }
          - { shard: assembler, number: 4 }
          - { shard: passes, number: 5 }
          - { shard: system, number: 6 }
          - { shard: language, number: 7 }
    env:
      TURKEY_BOOT: ${{ github.workspace }}/boot/stage2
      TURKEY_REQUIRE_OPENSSL: 1
    steps:
      - uses: actions/checkout@v4
        # Every commit, since the tests check that the commit
        # bootstrap/PROVENANCE names exists, but no blob until it is read:
        # the history holds hundreds of megabytes of old bootstraps.
        with:
          fetch-depth: 0
          filter: blob:none
      # pytest from apt: Ubuntu 24.04 refuses a system-wide `pip install`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-pytest-xdist libssl-dev openssl gdb llvm
      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot
      # An artifact does not keep the executable bit.
      - run: chmod +x boot/stage2
      - run: sh scripts/ci-shard.sh ${{ matrix.shard }} -q -m '' --durations=20
      - if: ${{ !cancelled() }}
        run: sh scripts/test.sh --selftest
      - if: ${{ !cancelled() }}
        run: sh scripts/test.sh --shard ${{ matrix.number }}/7
      - if: ${{ !cancelled() }}
        run: sh scripts/test.sh --exe --shard ${{ matrix.number }}/7

  floor:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot
      - run: chmod +x boot/stage2
      - run: |
          mkdir out
          printf 'fun main() {\n    print("hello, world")\n}\n' > out/hello.gob
          boot/stage2 build -f exe -o out/hello out/hello.gob
          boot/stage2 build -f exe -o out/boot src/Main.gob
      - run: |
          docker run --rm -v "$PWD:/w" -w /w almalinux:9 sh -euxc '
            ldd --version | head -n 1 | grep -q " 2\.34$"
            test "$(out/hello)" = "hello, world"
            out/boot build -f exe -o /tmp/hello out/hello.gob
            test "$(/tmp/hello)" = "hello, world"
            out/boot build -f exe -o /tmp/boot src/Main.gob
            test "$(sha256sum < /tmp/boot)" = "$(sha256sum < out/boot)"'
