# The compiler built and tested on arm64 Linux, natively.
#
# Under gcc, Ubuntu's `cc`, and not clang as well: `turkey` writes its own
# executables, so the C compiler only links the committed bootstrap and
# compiles the few C files the tests use. Built from the committed bootstrap,
# as a user would build it.
#
# `turkey` is built once and the suite is split across jobs by
# `scripts/ci-shard.sh`: a free runner has four cores, and the whole suite on
# one takes over twenty minutes. Each shard runs with `-m ''`, so the
# fixed point runs in the shard that holds it, overlapping that shard's other
# tests. The cases the Turkey harness runs (`scripts/test.sh`) are split the
# same seven ways by its own `--shard`, and each job also runs its selftest.
#
# The test jobs install OpenSSL 3's headers and libraries (`libssl-dev`) for
# the programs that import `Net.TLS`, which load `libssl.so.3` and
# `libcrypto.so.3`, and set `TURKEY_REQUIRE_OPENSSL` so that those tests fail
# rather than skip if it is missing. They also install gdb and LLVM's tools,
# which `tests/test_debug_info.py` reads `-g`'s DWARF with and skips without.
#
# The `floor` job runs what `turkey` writes on the oldest glibc it
# supports, 2.34, in an AlmaLinux 9 container: hello world, and `turkey`
# written by itself, compiling itself to the same bytes there.
name: linux

on:
  push:
    branches: [main]
  pull_request:

# A push to a pull request cancels the run still going for its previous head:
# a run is nine jobs, and a superseded one holds runners a newer run is
# waiting for. Pushes to `main` each finish, so every commit there is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURKEY_CC: gcc

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: build/stages/turkey
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: bootstrap, number: 1 }
          - { shard: native, number: 2 }
          - { shard: generational, number: 3 }
          - { shard: assembler, number: 4 }
          - { shard: passes, number: 5 }
          - { shard: system, number: 6 }
          - { shard: language, number: 7 }
    env:
      TURKEY_BOOT: ${{ github.workspace }}/boot/turkey
      TURKEY_REQUIRE_OPENSSL: 1
    steps:
      - uses: actions/checkout@v4
        # Every commit, since the tests check that the commit
        # bootstrap/PROVENANCE names exists, but no blob until it is read:
        # the history holds hundreds of megabytes of old bootstraps.
        with:
          fetch-depth: 0
          filter: blob:none
      # pytest from apt: Ubuntu 24.04 refuses a system-wide `pip install`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-pytest-xdist libssl-dev openssl gdb llvm
      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot
      # An artifact does not keep the executable bit.
      - run: chmod +x boot/turkey
      - run: sh scripts/ci-shard.sh ${{ matrix.shard }} -q -m '' --durations=20
      - if: ${{ !cancelled() }}
        run: sh scripts/test.sh --selftest
      - if: ${{ !cancelled() }}
        run: sh scripts/test.sh --shard ${{ matrix.number }}/7

  floor:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot
      - run: chmod +x boot/turkey
      - run: |
          mkdir out
          printf 'fun main() {\n    print("hello, world")\n}\n' > out/hello.gob
          boot/turkey build -f exe -o out/hello out/hello.gob
          boot/turkey build -f exe -o out/turkey src/Main.gob
          printf 'import Net.TLS as TLS\n\nfun main() {\n    let _ = TLS.clientConfig(TLS.SystemRoots, [])\n    print("configured")\n}\n' > out/tls.gob
          boot/turkey build -f exe -o out/tls out/tls.gob
      - run: |
          docker run --rm -v "$PWD:/w" -w /w almalinux:9 sh -euxc '
            ldd --version | head -n 1 | grep -q " 2\.34$"
            test "$(out/hello)" = "hello, world"
            out/turkey build -f exe -o /tmp/hello out/hello.gob
            test "$(/tmp/hello)" = "hello, world"
            out/turkey build -f exe -o /tmp/turkey src/Main.gob
            test "$(sha256sum < /tmp/turkey)" = "$(sha256sum < out/turkey)"
            test -e /usr/lib64/libssl.so.3 || dnf -y -q install openssl-libs
            test "$(out/tls)" = "configured"'
