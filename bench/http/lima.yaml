# A Linux VM for bench/http/ on an Apple Silicon Mac, where macOS's own
# loopback limits how many connections a benchmark can open (README.md says
# how). Server and load generator both run inside the VM, so their traffic
# goes through Linux's TCP stack.
#
#   limactl start --name=turkey-bench bench/http/lima.yaml
#   limactl shell turkey-bench sh "$PWD/bench/http/linux-setup.sh"
#   limactl shell turkey-bench sh -c '. ~/bench-env.sh && cd ~/turkey &&
#       sh scripts/build.sh --fixpoint && sh bench/http/run.sh'
#
# linux-setup.sh installs the toolchains and clones this checkout's commit
# into ~/turkey on the VM's own disk, since the home directory is mounted
# read-only and a build over the mount would be slow. 12 vCPUs leave room for 4 server
# threads, 4 load-generator threads and the rest of the system; the Mac's
# scheduler still decides which physical cores they run on.
vmType: vz
arch: aarch64
cpus: 12
memory: 16GiB
disk: 40GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
mounts:
  - location: "~"
    writable: false
  - location: /tmp/lima
    writable: true
