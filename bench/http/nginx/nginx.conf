# nginx as the ceiling: `return` for /hello, and a static file for /1m.
# run.sh fills in WORKERS, PORT, TLS and ROOT.
worker_processes WORKERS;
daemon off;
master_process on;
error_log stderr warn;
pid ROOT/nginx.pid;
events { worker_connections 20000; }
http {
    access_log off;
    sendfile on;
    keepalive_requests 1000000;
    keepalive_timeout 60s;
    client_body_temp_path ROOT/body;
    proxy_temp_path ROOT/proxy;
    fastcgi_temp_path ROOT/fastcgi;
    uwsgi_temp_path ROOT/uwsgi;
    scgi_temp_path ROOT/scgi;
    server {
        listen 127.0.0.1:PORT TLS;
        TLSCONFIG
        location = /hello { default_type text/plain; return 200 "Hello, world!\n"; }
        location = /1m { default_type application/octet-stream; alias ROOT/1m; }
    }
}
