[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turkey-lite"
version = "0.1.0"
description = "Prototype implementation of the turkey-lite language"
requires-python = ">=3.11"
dependencies = ["llvmlite~=0.44.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["turkey"]

[tool.setuptools.package-data]
# The prelude is source now, not a Python string (SPEC-DELTAS.md 41).
turkey = ["py.typed", "lib/*.tl", "lib/**/*.tl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
