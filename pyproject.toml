[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turkey-lite"
version = "0.1.0"
description = "Prototype implementation of the turkey-lite language"
requires-python = ">=3.11"
# A range rather than a pin, and it is tested as one: the suite passes on
# 0.44 (LLVM 15, typed pointers, legacy pass manager) and on 0.49 (LLVM 22,
# opaque pointers, new pass manager). `llvmgen._optimize` is the one place the
# two APIs differ. Nothing here depends on the pointer spelling: llvmlite's IR
# builder still writes typed pointers and LLVM upgrades them on parse, so only
# the *rendering* of a module changes, which no test pins any more.
dependencies = ["llvmlite>=0.44"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[tool.setuptools]
packages = ["turkey"]

[tool.setuptools.package-data]
# The prelude is source now, not a Python string (SPEC-DELTAS.md 41).
turkey = ["py.typed"]

[tool.setuptools.data-files]
"runtime" = ["runtime/turkey_runtime.c", "runtime/turkey_runtime.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default. `worksteal` because a few items are long -- one `boot asm`
# over the compiler's own source is about ninety seconds -- and plain `load`
# leaves other workers idle behind them. `-n0` runs serially -- not
# `-p no:xdist`, which unloads the plugin while these `addopts` still pass
# `-n`, and pytest then exits with "unrecognized arguments: -n --dist".
# `-m 'not bootstrap'`: the self-compilation fixed point costs minutes and
# re-pays on every change to `boot/`, which is exactly when it is least wanted.
# Opt in with `pytest -m bootstrap` -- a command-line `-m` replaces this one.
addopts = "-n auto --dist worksteal -m 'not bootstrap'"
markers = [
    "bootstrap: links stage2 and recompiles the compiler with it (minutes; run with -m bootstrap)",
]
