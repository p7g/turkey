[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turkey-lite"
version = "0.1.0"
description = "Prototype implementation of the turkey-lite language"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["turkey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
