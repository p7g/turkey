<!doctype html>
<!--
  The standard library's API documentation, rendered in the browser from the
  JSON `boot doc` writes. scripts/docs.sh replaces the marker line in the
  <script type="application/json"> element below with that JSON; nothing else
  is generated, and the page loads nothing from anywhere.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey library</title>
<style>
:root {
  --bg: #fdfcfa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e2dd;
  --code-bg: #f3f1ec; --accent: #9a3b12; --hit: #fff1c2;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181a; --fg: #e6e4df; --muted: #9a9aa0; --line: #2e2e33;
    --code-bg: #232327; --accent: #f0915d; --hit: #4a3d12;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: 17rem 1fr; min-height: 100vh;
}
nav {
  border-right: 1px solid var(--line); padding: 1rem; position: sticky; top: 0;
  height: 100vh; overflow-y: auto;
}
nav input {
  width: 100%; padding: .45rem .6rem; font: inherit; color: var(--fg);
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
}
nav ul { list-style: none; padding: 0; margin: .8rem 0 0; }
nav li a { display: block; padding: .1rem .3rem; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
nav li a.current { background: var(--code-bg); }
main { padding: 1.5rem 2.5rem 4rem; max-width: 62rem; min-width: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-family: var(--mono); font-size: 1.5rem; margin: 0 0 .25rem; }
.file { color: var(--muted); font-size: 13px; font-family: var(--mono); }
.item { border-top: 1px solid var(--line); padding: .8rem 0; }
.item:target { background: var(--hit); }
.sig { font-family: var(--mono); font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.kw { color: var(--muted); }
.name { font-weight: 600; }
.doc { margin: .35rem 0 0 1.2rem; }
.doc p { margin: .3rem 0; }
.doc pre, code { font-family: var(--mono); font-size: 13px; background: var(--code-bg); border-radius: 3px; }
code { padding: 0 .2rem; }
.doc pre { padding: .5rem .7rem; overflow-x: auto; }
.members { margin: .4rem 0 0 1.2rem; }
.members .sig { margin-top: .3rem; }
.none { color: var(--muted); font-style: italic; }
.result { padding: .5rem 0; border-top: 1px solid var(--line); }
.result .where { color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  body { display: block; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  nav ul { max-height: 12rem; overflow-y: auto; }
  main { padding: 1rem; }
}
</style>
</head>
<body>
<nav>
  <input id="search" type="search" placeholder="Search names, types, comments" autocomplete="off">
  <ul id="modules"></ul>
</nav>
<main id="main"></main>
<script id="data" type="application/json">
@DOCS_JSON@
</script>
<script>
"use strict";
const docs = JSON.parse(document.getElementById("data").textContent);
const modules = new Map(docs.modules.map(m => [m.name, m]));

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));
const kw = s => `<span class="kw">${s}</span>`;
const nm = s => `<span class="name">${esc(s)}</span>`;
const anchor = (m, name) => `${m}:${name}`;
// An href to the element whose id is `id`. Encoded, since an operator's id
// can hold `%`, `#` or `?`.
const link = id => `#${esc(encodeURIComponent(id))}`;

// A comment as paragraphs. Lines indented four spaces are code, and `x` is code inline.
function comment(text) {
  if (!text) return "";
  const out = [];
  for (const block of text.split(/\n\s*\n/)) {
    const lines = block.split("\n");
    if (lines.every(l => l.startsWith("    ") || l.trim() === "")) {
      out.push(`<pre>${esc(lines.map(l => l.slice(4)).join("\n"))}</pre>`);
    } else {
      out.push(`<p>${esc(block).replace(/`([^`]+)`/g, "<code>$1</code>")}</p>`);
    }
  }
  return `<div class="doc">${out.join("")}</div>`;
}

// A constructor as its declaration writes it, with an existential's bracket:
// the variables no predicate mentions, then the predicates.
function constructor(c) {
  const mentioned = v => c.context.some(p => p.split(/[^A-Za-z0-9_']+/).includes(v));
  const bracket = [...c.exists.filter(v => !mentioned(v)), ...c.context];
  const name = nm(c.name) + (bracket.length ? `[${esc(bracket.join(", "))}]` : "");
  if (c.fields) {
    const fs = c.fields.map(f => `${f.mutable ? "var " : ""}${esc(f.name)} : ${esc(f.type)}`);
    return `${name} { ${fs.join(", ")} }`;
  }
  return c.args.length ? `${name}(${c.args.map(esc).join(", ")})` : name;
}

// The signature an item is shown under, in the syntax a program writes.
function signature(item) {
  const params = item.params && item.params.length ? " " + item.params.join(" ") : "";
  switch (item.kind) {
    case "function": return `${kw("fun")} ${nm(item.name)} : ${esc(item.type)}`;
    case "value": return `${kw(item.mutable ? "var" : "let")} ${nm(item.name)} : ${esc(item.type)}`;
    case "alias": return `${kw("type")} ${nm(item.name)}${esc(params)} = ${esc(item.type)}`;
    case "type": {
      const derives = item.derives.length ? " : " + esc(item.derives.join(", ")) : "";
      const cons = item.constructors.map(constructor);
      const body = cons.length ? "\n    = " + cons.join("\n    | ") : "";
      return `${kw("type")} ${nm(item.name)}${esc(params)}${derives}${body}`;
    }
    case "class": {
      const supers = item.supers.length ? " : " + esc(item.supers.join(", ")) : "";
      return `${kw("class")} ${nm(item.name)} ${esc(item.param)}${supers}`;
    }
    case "instance": {
      const ctx = item.context.length ? " : " + esc(item.context.join(", ")) : "";
      return `${kw("instance")} ${esc(item.name)}${ctx}`;
    }
    case "operator":
      return `${kw("infix")} ${esc(item.group)} (${nm(item.name)}) = ${esc(item.function)}  ${kw("-- " + item.associativity + "-associative")}`;
    case "reexport": {
      const from = item.from && modules.has(item.from)
        ? `<a href="${link(anchor(item.from, item.original))}">${esc(item.from)}.${esc(item.original)}</a>`
        : esc((item.from ? item.from + "." : "") + item.original);
      const type = item.type ? ` : ${esc(item.type)}` : "";
      return `${nm(item.name)}${type}  ${kw("-- from")} ${from}`;
    }
  }
  return esc(item.name);
}

// Each item's id: its module and name. An instance has no name of its own, so its line.
const itemId = (m, item) => anchor(m.name, item.kind === "instance" ? "instance:" + item.line : item.name);

function itemHTML(m, item) {
  let members = "";
  if (item.kind === "type") {
    const documented = item.constructors.filter(c => c.comment || (c.fields || []).some(f => f.comment));
    members = documented.map(c => `<div class="sig">${constructor(c)}</div>${comment(c.comment)}`
      + (c.fields || []).filter(f => f.comment).map(f => `<div class="sig">.${esc(f.name)}</div>${comment(f.comment)}`).join("")).join("");
  } else if (item.kind === "class") {
    members = item.methods.map(meth => `<div class="sig" id="${esc(anchor(m.name, meth.name))}">${kw("fun")} ${nm(meth.name)} : ${esc(meth.type)}${meth.default ? "  " + kw("-- has a default") : ""}</div>${comment(meth.comment)}`).join("")
      + item.families.map(f => `<div class="sig" id="${esc(anchor(m.name, item.name + "." + f.name))}">${kw("type")} ${nm(f.name)} ${esc(item.param)}</div>${comment(f.comment)}`).join("");
  }
  return `<div class="item" id="${esc(itemId(m, item))}"><div class="sig">${signature(item)}</div>`
    + comment(item.comment) + (members ? `<div class="members">${members}</div>` : "") + "</div>";
}

// Instances and re-exports go last, after what the module itself defines.
const order = {instance: 2, reexport: 3};

function showModule(name) {
  const m = modules.get(name);
  if (!m) return showIndex();
  const items = [...m.items].sort((a, b) => (order[a.kind] || 1) - (order[b.kind] || 1));
  document.getElementById("main").innerHTML =
    `<h1>${esc(m.name)}</h1><div class="file">${esc(m.file)}</div>`
    + (m.comment ? comment(m.comment) : `<p class="none">No module comment.</p>`)
    + items.map(i => itemHTML(m, i)).join("");
  document.title = m.name;
  for (const a of document.querySelectorAll("#modules a")) a.classList.toggle("current", a.dataset.module === name);
}

function showIndex() {
  document.getElementById("main").innerHTML = "<h1>Turkey library</h1>"
    + docs.modules.map(m => `<div class="result"><a href="${link(m.name)}">${esc(m.name)}</a>`
      + `${m.comment ? `<div class="where">${esc(m.comment.split("\n\n")[0])}</div>` : ""}</div>`).join("");
}

// Every item with the module it is in, and the text a search looks through.
const index = [];
for (const m of docs.modules) {
  for (const item of m.items) {
    const types = [item.type, ...(item.methods || []).map(x => x.name + " " + x.type),
                   ...(item.constructors || []).map(c => c.name + " " + c.type)];
    index.push({m, item, name: item.name.toLowerCase(),
                text: [item.name, ...types, item.comment].filter(Boolean).join("\n").toLowerCase()});
  }
}

// Exact names first, then names that start with the query, then any other match.
function search(query) {
  const q = query.trim().toLowerCase();
  if (!q) return route();
  const rank = e => e.name === q ? 0 : e.name.startsWith(q) ? 1 : e.name.includes(q) ? 2 : 3;
  const all = index.filter(e => e.text.includes(q)).sort((a, b) => rank(a) - rank(b));
  const hits = all.slice(0, 200);
  const shown = all.length > hits.length ? `, the first ${hits.length} shown` : "";
  document.getElementById("main").innerHTML = `<h1>${all.length} results${shown}</h1>`
    + hits.map(({m, item}) => `<div class="result"><div class="where"><a href="${link(itemId(m, item))}">${esc(m.name)}</a></div>`
      + `<div class="sig">${signature(item)}</div>${comment(item.comment)}</div>`).join("");
}

function route() {
  let hash = location.hash.slice(1);
  try { hash = decodeURIComponent(hash); } catch (e) { /* typed by hand, not encoded */ }
  const name = hash.split(":")[0];
  if (!name) return showIndex();
  showModule(name);
  const target = document.getElementById(hash);
  if (target) target.scrollIntoView();
}

document.getElementById("modules").innerHTML = docs.modules.map(m =>
  `<li><a href="${link(m.name)}" data-module="${esc(m.name)}">${esc(m.name)}</a></li>`).join("");
const box = document.getElementById("search");
box.addEventListener("input", () => search(box.value));
window.addEventListener("hashchange", () => { box.value = ""; route(); });
route();
</script>
</body>
</html>
